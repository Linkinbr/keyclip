<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title data-i18n="optionsTitle"></title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <header id="page-header" hidden>
      <img src="icons/icon48.png" alt="" width="36" height="36">
      <h1 data-i18n="shortName"></h1>
    </header>

    <div class="autosave">
      <span data-i18n="autosave"></span>
      <span id="status" class="status" aria-live="polite" data-i18n="saved"></span>
    </div>

    <div id="welcome" class="welcome" hidden>
      <strong data-i18n="welcomeTitle"></strong>
      <ol>
        <li data-i18n="welcomePin"></li>
        <li data-i18n="welcomeClick"></li>
        <li data-i18n="welcomeOptions"></li>
      </ol>
    </div>

    <section>
      <div class="length-head">
        <label for="length-number" data-i18n="length"></label>
        <input id="length-number" type="number" min="4" max="64" inputmode="numeric">
      </div>
      <input id="length-range" type="range" min="4" max="64" data-i18n-label="lengthLabel">
      <div class="range-scale"><span>4</span><span>64</span></div>
    </section>

    <section>
      <h2 data-i18n="characters"></h2>

      <label class="option">
        <span class="option-text"><span data-i18n="uppercase"></span> <small>A–Z</small></span>
        <input id="uppercase" type="checkbox" class="switch">
      </label>

      <label class="option">
        <span class="option-text"><span data-i18n="lowercase"></span> <small>a–z</small></span>
        <input id="lowercase" type="checkbox" class="switch">
      </label>

      <label class="option">
        <span class="option-text"><span data-i18n="numbers"></span> <small>0–9</small></span>
        <input id="numbers" type="checkbox" class="switch">
      </label>

      <label class="option">
        <span class="option-text"><span data-i18n="symbols"></span> <small>!@#$%…</small></span>
        <input id="symbols" type="checkbox" class="switch">
      </label>

      <div class="symbols-field">
        <label for="symbol-set" data-i18n="allowedSymbols"></label>
        <div class="symbols-input">
          <input id="symbol-set" type="text" spellcheck="false" autocomplete="off">
          <button id="reset-symbols" type="button" class="button-secondary" data-i18n="reset"></button>
        </div>
      </div>

      <label class="option">
        <span class="option-text"><span data-i18n="avoidAmbiguous"></span> <small>0 O o 1 l I |</small></span>
        <input id="exclude-ambiguous" type="checkbox" class="switch">
      </label>

      <p id="error" class="error" role="alert" hidden></p>
    </section>

    <section class="preview">
      <div class="preview-head">
        <h2 data-i18n="example"></h2>
        <button id="regenerate" type="button" class="icon-button" data-i18n-label="regenerate">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
      <code id="sample"></code>
      <div class="strength">
        <div class="meter"><span id="meter-fill"></span></div>
        <span id="strength-label"></span>
      </div>
    </section>

    <section class="shortcut">
      <span data-i18n="shortcut"></span>
      <span class="shortcut-value">
        <kbd id="shortcut-keys"></kbd>
        <button id="change-shortcut" type="button" class="link" data-i18n="shortcutChange"></button>
      </span>
    </section>

    <footer>
      <p id="support-text" class="support-text" hidden><strong data-i18n="supportTitle"></strong> <span data-i18n="supportText"></span></p>
      <div class="footer-buttons">
        <a id="donate" class="button button-primary" target="_blank" rel="noopener" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h13v5a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5V9zm13 1.5h1.5a2.5 2.5 0 0 1 0 5H16v-2h1.5a.5.5 0 0 0 0-1H16v-2z"/><path d="M7 6.5c0-1 1-1 1-2.5M11 6.5c0-1 1-1 1-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-i18n="donate"></span>
        </a>
        <a id="source" class="button" target="_blank" rel="noopener" data-i18n-label="sourceCodeLabel" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1.1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.6 18.3 5 18.3 5c.6 1.6.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>
          <span>GitHub</span>
        </a>
        <a id="rate" class="button" target="_blank" rel="noopener" data-i18n-label="rateLabel">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z"/></svg>
          <span>Chrome Web Store</span>
        </a>
      </div>
      <p id="version" class="version"></p>
    </footer>
  </main>
  <script src="i18n.js"></script>
  <script type="module" src="options.js"></script>
</body>
</html>
